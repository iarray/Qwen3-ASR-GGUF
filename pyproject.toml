[project]
name = "qwen3-asr-gguf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IArray", email = "286423109@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "gguf>=0.19.0",
    "librosa>=1.0.0",
    "nagisa>=0.3.0",
    "onnxruntime-directml>=1.24.4",
    "onnxscript>=0.7.2",
    "pyannote-audio>=4.0.7",
    "sentencepiece>=0.2.2",
    "soundfile>=0.14.0",
    "srt>=3.5.3",
    "torch>=2.14.0",
    "transformers==4.57.6",
    "ttkbootstrap>=2.2.3",
    "typer>=0.27.2",
]

[project.scripts]
qwen3-asr-gguf = "qwen3_asr_gguf:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
